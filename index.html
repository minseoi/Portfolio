<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조민성</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
      'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #1b1f24;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: absolute;
    top: -20%;
    right: -10%;
    width: 46vw;
    height: 46vw;
    max-width: 560px;
    max-height: 560px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(11,98,214,0.14), rgba(11,98,214,0) 70%);
  }
  body::after {
    content: '';
    position: absolute;
    bottom: -25%;
    left: -12%;
    width: 40vw;
    height: 40vw;
    max-width: 480px;
    max-height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle at 70% 70%, rgba(11,98,214,0.10), rgba(11,98,214,0) 70%);
  }
  .hero {
    max-width: 640px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .kicker {
    font-size: 0.8rem;
    letter-spacing: 0.24em;
    color: #0b62d6;
    font-weight: 700;
    text-transform: uppercase;
  }
  h1 {
    margin-top: 18px;
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  h1 .accent { color: #0b62d6; }
  p.sub {
    margin-top: 20px;
    font-size: 1.15rem;
    color: #6b7280;
    font-weight: 500;
    line-height: 1.6;
  }
  .buttons {
    margin-top: 44px;
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 15px 34px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.primary {
    background: #0b62d6;
    color: #fff;
    box-shadow: 0 8px 20px rgba(11,98,214,0.25);
  }
  .btn.primary:hover { background: #0951b3; box-shadow: 0 10px 24px rgba(11,98,214,0.32); }
  .btn.secondary {
    background: #f7f9fc;
    color: #1b1f24;
    border: 1px solid #e5e9f0;
  }
  .btn.secondary:hover { background: #eef2f8; }
</style>
</head>
<body>
  <div class="hero">
    <div class="kicker">게임 클라이언트 프로그래머</div>
    <h1>조민성</h1>
    <div class="buttons">
      <a class="btn primary" href="이력서.html">이력서 보기</a>
      <a class="btn secondary" href="포트폴리오.html">포트폴리오 보기</a>
    </div>
  </div>
</body>
</html>
